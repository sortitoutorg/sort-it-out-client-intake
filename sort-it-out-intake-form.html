    border-radius: 8px;

    border-color: var(--pink-border);

  .check-row.selected, .radio-row.selected {

  .custom-box {

  .check-mark { display: none; color: white; font-size: 12px; font-weight: 700; }
  .check-row.selected .check-mark { display: block; }
  .custom-circle {
    width: 18px; height: 18px; flex-shrink: 0;
    border: 1.5px solid #ccc;

  }
  .radio-row.selected .custom-circle {

  .radio-row.selected .custom-circle::after {

  .other-input { margin-top: 8px; display: none; }

</style>
